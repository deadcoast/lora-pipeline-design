[project]
name = "lora-pipeline-design"
version = "0.1.0"
description = "Code-driven SDXL person LoRA training and ComfyUI validation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12",
    "pillow>=10.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
vision = [
    "torch>=2.13.0",
    "transformers>=5.14.1,<6",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.4",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"src/__init__.py" = ["TC004"]
