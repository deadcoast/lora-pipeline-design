[project]
name = "lora-pipeline-design"
version = "0.6.0"
description = "MIVIM LoRA Studio: a guided SDXL training companion for Comfy Desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12",
    "pillow>=10.3",
    "pyside6>=6.10.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "websocket-client>=1.7",
]

[project.gui-scripts]
mivim-lora-studio = "src.desktop:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.optional-dependencies]
vision = [
    "torch>=2.13.0",
    "transformers>=5.14.1,<6",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-qt>=4.5.0",
    "ruff>=0.14.0",
    "types-pyyaml>=6.0.12",
]
deploy = [
    "nuitka==4.0",
    "pip==26.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"workflows" = "workflows"

[tool.ruff.lint.per-file-ignores]
"src/__init__.py" = ["TC004"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
