# =====================================================================
# ai-toolkit training config — SDXL person LoRA
# Materialize and run via:
#   python -m src.train --config configs/person_sdxl.yaml
#
# This is a conservative starting point for a single-person SDXL identity LoRA.
# The desktop app verifies the selected trainer can see CUDA before using it.
# =====================================================================
job: extension
config:
  # Name of this training run. Checkpoints are saved as <name>_<step>.safetensors
  name: "person_v1"

  process:
    - type: sd_trainer
      # The wrapper replaces this with the selected trigger token.
      trigger_word: "{trigger}"

      # The wrapper replaces this with CHECKPOINTS_DIR for each run.
      training_folder: "output"
      device: cuda:0

      # ---- The LoRA network ----
      network:
        type: lora
        linear: 16          # (TUNE) rank. 16 is a strong default for a person.
        linear_alpha: 16    #        keep alpha == rank as a baseline.

      # ---- Saving ----
      save:
        dtype: float16
        save_every: 250     # save a checkpoint every N steps -> pick the best epoch
        max_step_saves_to_keep: 8

      # ---- Dataset(s) ----
      datasets:
        # The wrapper replaces this with DATASETS_DIR/<run name> for each run.
        - folder_path: "datasets/person_v1"
          caption_ext: "txt"
          caption_dropout_rate: 0.05   # occasionally drop caption -> better generalization
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]      # multi-res / aspect-bucket friendly

      # ---- Training loop ----
      train:
        batch_size: 1        # broad compatibility and predictable memory use
        steps: 2000          # (TUNE) ~1500-2500 for a person. Watch samples for overfit.
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false   # usually leave TE frozen for SDXL person LoRAs
        gradient_checkpointing: true
        noise_scheduler: "ddpm"  # SDXL is a diffusion model, not a flow model
        optimizer: "adamw8bit"
        lr: 1.0e-4           # (TUNE) 1e-4 default; 5e-5 if it overfits fast
        dtype: bf16

      # ---- Base model ----
      model:
        name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
        arch: "sdxl"       # current ai-toolkit model selector
        is_xl: true        # compatibility with older ai-toolkit releases

      # ---- In-training preview samples (watch it learn!) ----
      sample:
        sampler: "ddpm"
        sample_every: 250    # render preview images every N steps
        width: 1024
        height: 1024
        guidance_scale: 6.0
        sample_steps: 25
        seed: 42
        walk_seed: false
        samples:
          # The wrapper substitutes {trigger} for each run.
          - prompt: "{trigger}, cinematic portrait, soft window light, 85mm, shallow depth of field"
          - prompt: "{trigger}, standing on a city street at golden hour, 35mm, candid"
          - prompt: "{trigger}, black and white studio headshot, dramatic lighting"
          - prompt: "{trigger}, hiking on a mountain trail, wide shot, natural light"

# meta is optional but handy for tracking runs
meta:
  name: "person_v1"
  version: "1.0"
