# =====================================================================
# ai-toolkit training config — SDXL person LoRA
# Run with:  python run.py <path-to-this-file>   (from the ai-toolkit dir)
# or via this repo:  python -m src.train --config configs/person_sdxl.yaml
#
# This is a sensible STARTING POINT for a single-person identity LoRA on an
# RTX 5090. Read the inline notes; the values you'll tune most are marked (TUNE).
# =====================================================================
job: extension
config:
  # Name of this training run. Checkpoints are saved as <name>_<step>.safetensors
  name: "person_v1"

  process:
    - type: sd_trainer

      # Where checkpoints + samples are written (relative to ai-toolkit's CWD,
      # so use an absolute path or copy outputs afterward).
      training_folder: "output"
      device: cuda:0

      # ---- The LoRA network ----
      network:
        type: lora
        linear: 16          # (TUNE) rank. 16 is a strong default for a person.
        linear_alpha: 16    #        keep alpha == rank as a baseline.

      # ---- Saving ----
      save:
        dtype: float16
        save_every: 250     # save a checkpoint every N steps -> pick the best epoch
        max_step_saves_to_keep: 8

      # ---- Dataset(s) ----
      datasets:
        - folder_path: "PUT_ABSOLUTE_PATH_TO/datasets/person_v1"  # (EDIT) image+txt pairs
          caption_ext: "txt"
          caption_dropout_rate: 0.05   # occasionally drop caption -> better generalization
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]      # multi-res / aspect-bucket friendly

      # ---- Training loop ----
      train:
        batch_size: 1        # (TUNE) 5090 can push higher; start at 1 for stability
        steps: 2000          # (TUNE) ~1500-2500 for a person. Watch samples for overfit.
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false   # usually leave TE frozen for SDXL person LoRAs
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4             # (TUNE) 1e-4 default; 5e-5 if it overfits fast
        dtype: bf16

      # ---- Base model ----
      model:
        name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
        is_sdxl: true

      # ---- In-training preview samples (watch it learn!) ----
      sample:
        sampler: "ddpm"
        sample_every: 250    # render preview images every N steps
        width: 1024
        height: 1024
        guidance_scale: 6.0
        sample_steps: 25
        seed: 42
        walk_seed: false
        prompts:
          # IMPORTANT: use your trigger token consistently. Default here: "ohwx person"
          - "ohwx person, cinematic portrait, soft window light, 85mm, shallow depth of field"
          - "ohwx person, standing on a city street at golden hour, 35mm, candid"
          - "ohwx person, black and white studio headshot, dramatic lighting"
          - "ohwx person, hiking on a mountain trail, wide shot, natural light"

# meta is optional but handy for tracking runs
meta:
  name: "person_v1"
  version: "1.0"
